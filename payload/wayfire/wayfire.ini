# NETHOS under Wayfire.
#
# Wayfire rather than sway, for three things sway structurally cannot do:
#
#   * windows float by default and stack, the way a desktop is expected to
#     behave, instead of being tiled into a layout you did not ask for
#   * real decorations, so a window has minimise, maximise and close where
#     everyone's hand already reaches for them
#   * blur, done in the compositor -- which is what makes the glass real. In
#     CSS, backdrop-filter is per-frame work over the whole surface and it is
#     what made the shell unusable on software rendering. Here it is the
#     compositor's job and costs the shell nothing.
#
# It also snaps on drag, which sway has no concept of.

[core]
plugins = \
  autostart \
  ipc \
  ipc-rules \
  stipc \
  alpha \
  animate \
  blur \
  command \
  decoration \
  expo \
  fast-switcher \
  grid \
  move \
  place \
  resize \
  vswitch \
  window-rules \
  wm-actions

# One workspace. Rule 9: the desktop is a desk, not a filing system, and
# workspace grids are a power feature that costs every user a mental model.
vwidth = 1
vheight = 1

close_top_view = <super> KEY_Q | <super> KEY_W

# ---------------------------------------------------------------- glass --
[blur]
# kawase is the cheap one and the difference from gaussian is not visible at
# these radii. iterations trade cost against smoothness; 2 is the sweet spot.
method = kawase
kawase_iterations = 2
kawase_offset = 3.0
kawase_degrade = 1
# Saturation lifted very slightly, the way frosted glass concentrates colour.
saturation = 1.15
# Layer surfaces -- the panel, the dock, the launcher -- blur too, which is the
# whole point: they are what should look like glass.
blur_by_default = type is toplevel | type is layer

[alpha]
# Windows are slightly transparent so the blur behind them reads as depth
# rather than as a flat frosted pane. Small: past about 8% it stops looking
# like glass and starts looking like a bug.
min_value = 0.5
modifier = <super> KEY_A

# ------------------------------------------------------------ windows --
[decoration]
# Title bars exist so minimise and maximise exist. font_size and height are
# generous rather than compact: the buttons are a target, not a decoration.
title_height = 32
border_size = 0
button_order = minimize maximize close
active_color = \#FFFFFF26
inactive_color = \#FFFFFF14
# docs/DESIGN.md 31: larger than feels right.
corner_radius = 14

[move]
# The snapping sway does not have. Drag a window into an edge and it takes
# that half; into a corner and it takes that quarter. 20px of slop, because a
# threshold you have to aim for is worse than none.
activate = <super> BTN_LEFT
enable_snap = true
enable_snap_off = true
snap_threshold = 20
snap_off_threshold = 20
join_views = true

[resize]
activate = <super> BTN_RIGHT

[grid]
# The keyboard half of the same idea, matching the keys Windows uses.
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_t = <super> KEY_UP
slot_b = <super> KEY_DOWN
slot_tl = <super> <ctrl> KEY_LEFT
slot_tr = <super> <ctrl> KEY_RIGHT
slot_bl = <super> <shift> <ctrl> KEY_LEFT
slot_br = <super> <shift> <ctrl> KEY_RIGHT
# The animation when a window snaps. Short, eased, and over. Rule 24: motion
# you can describe afterwards took too long.
type = crossfade
duration = 200

[wm-actions]
toggle_maximize = <super> KEY_F
minimize = <super> KEY_H

# ------------------------------------------------------------- motion --
[animate]
# 200ms in, 150ms out, no bounce and no overshoot. Rule 24.
open_animation = zoom
close_animation = zoom
duration = 200
startup_duration = 300
fade_duration = 150

[expo]
toggle = <super> KEY_E
duration = 250

[fast-switcher]
activate = <alt> KEY_TAB

# -------------------------------------------------------------- shell --
[autostart]
# Deliberately no wf-panel and no wf-background: NETHOS draws its own panel,
# dock and desktop. Starting Wayfire's as well gives two top bars.
# nethosd first: the surfaces load their content from it, and a shell that
# starts before its API paints an empty panel.
nethosd = systemctl --user start nethosd
shell = sh -c 'sleep 1; nethos-session'
# No wallpaper daemon: desktop.html draws the background, and two things
# drawing a background is how the dock ended up eating clicks under sway.
portal = /usr/libexec/xdg-desktop-portal-wlr

[command]
binding_terminal = <super> KEY_RETURN
command_terminal = foot
binding_launcher = <super> KEY_D
command_launcher = nethos-menu-toggle
binding_launcher2 = <super> KEY_SPACE
command_launcher2 = nethos-menu-toggle
binding_reload = <super> <shift> KEY_R
command_reload = nethos-reload

[window-rules]
# The shell's own surfaces are layer-shell and never windows, so nothing here
# is about them. This is for applications that open badly.
rule_1 = on created if app_id is "foot" then start_on_output ""
