# Which portal backend answers which interface.
#
# Without this file the portal has to discover a backend per interface, and
# discovery here finds nothing: gtk.portal declares UseIn=gnome, which excludes
# this desktop, and wlr.portal implements only Screenshot and ScreenCast. So
# FileChooser, Print, Notification and Settings match no backend at all and the
# portal waits out a timeout for each of them in turn.
#
# Measured on a cold boot: xdg-desktop-portal.service took 50.271s, and the
# shell's first page was fetched 46 seconds after nethos-view was launched.
# That is the white screen at startup -- not the compositor, not WebKit, not
# the surfaces being slow. They were never asked to draw, because nothing they
# depend on had finished starting.
#
# Naming the backends removes the discovery entirely. gtk answers everything it
# can -- it is installed, it works, only its own UseIn line said otherwise --
# and wlr keeps the two interfaces it actually implements, which are the two
# that need the compositor.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
