# foot, configured to wear NETHOS's window bar rather than its own.
#
# foot defaults to client-side decorations, so under Wayfire it drew a bare
# frame of its own and Wayfire drew none -- which is why the terminal was the
# one window on the desktop with no title bar, no minimise and no close, while
# everything else had all three. Two toolkits disagreeing about who decorates
# is what makes a desktop look assembled rather than designed.
#
# `csd.preferred=server` asks the compositor to decorate instead. Wayfire then
# gives it the same bar, the same radius and the same buttons as every other
# window, because it is the same decorator.

[main]
font=monospace:size=11
pad=10x10
dpi-aware=yes

[csd]
preferred=server

# foot spells this the American way; [colours] is rejected outright and the
# terminal opens showing a parse error instead of a shell.
[colors]
# Matching docs/DESIGN.md rather than foot's defaults: the terminal is part of
# the desktop, not a visitor from another one.
alpha=0.94
background=141820
foreground=e6ebf2

[cursor]
style=beam
blink=yes

[scrollback]
lines=10000
