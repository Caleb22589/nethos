# Where the assistant's thinking happens.
#
#     backend=local    Ollama on this machine. Private, offline, and on a
#                      16GB laptop the model is most of the memory: gemma4:e4b
#                      resident is ~10GB of 14GB usable, which leaves the
#                      desktop about a gigabyte and no swap to fall back on.
#     backend=cloud    An OpenAI-compatible API. Nothing large is resident, so
#                      the machine is free again -- but the request leaves it.
#
# Change backend, run `nethos-assistant restart`, and NETHBot follows. It is
# not told which is in use: cloud mode answers on the same port, in Ollama's
# own dialect, so nothing in NETHBot has to know or be edited.
backend=local

# --- local ---------------------------------------------------------------
local_model=gemma4:e4b
local_url=http://127.0.0.1:11434

# --- cloud ---------------------------------------------------------------
# Any OpenAI-compatible endpoint. OpenRouter is the default because its free
# tier needs no card and it publishes a list of genuinely free models -- those
# whose id ends in `:free`. `nethos-assistant models` prints them.
cloud_base_url=https://openrouter.ai/api/v1
cloud_model=google/gemma-4-26b-a4b-it:free

# The key is read from this file, never from here -- so this file stays
# shareable and the key does not end up in the repository. Create it yourself:
#
#     install -m 600 /dev/null ~/.config/nethos/assistant.key
#     $EDITOR ~/.config/nethos/assistant.key      # paste the key, nothing else
#
cloud_key_file=~/.config/nethos/assistant.key

# Where the shim listens. Must stay 11434 unless NETHBot is edited too: every
# call site in it hardcodes that port.
listen=127.0.0.1:11434
