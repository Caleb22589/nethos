<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Template App — NETHOS</title>
  <link rel="stylesheet" href="/lib/nethos.css">
  <script src="/lib/nethos.js"></script>
  <script src="/lib/nethos-ui.js"></script>
</head>
<body>
  <div class="neth-app-header">
    <h1>Template App</h1>
    <span class="neth-sub">edit me and save — this window reloads itself</span>
  </div>

  <div class="neth-card">
    <div class="neth-card-title">Persistent storage</div>
    <p class="neth-dim" style="margin-bottom:10px">
      Saved to <code>~/.local/state/nethos/apps/template.json</code>, so it
      survives reboots, reinstalls and profile wipes.
    </p>
    <label class="neth-label" for="note">Your note</label>
    <textarea class="neth-textarea" id="note" placeholder="Type something…"></textarea>
    <div class="neth-row" style="margin-top:10px">
      <button class="neth-btn neth-btn-primary" id="save">Save</button>
      <button class="neth-btn" id="clear">Clear</button>
      <span class="neth-spacer"></span>
      <span class="neth-dim neth-mono" id="saved-at"></span>
    </div>
  </div>

  <div class="neth-card" style="margin-top:14px">
    <div class="neth-card-title">System</div>
    <div id="status" class="neth-mono">…</div>
  </div>

<script>
(async () => {
  const os = await nethos.ready();
  const note = document.getElementById("note");
  const savedAt = document.getElementById("saved-at");

  // ---- storage -----------------------------------------------------------
  note.value = await os.storage.get("note", "");
  const stamp = await os.storage.get("savedAt", null);
  if (stamp) savedAt.textContent = "saved " + new Date(stamp).toLocaleString();

  document.getElementById("save").addEventListener("click", async () => {
    await os.storage.set("note", note.value);
    const now = Date.now();
    await os.storage.set("savedAt", now);
    savedAt.textContent = "saved " + new Date(now).toLocaleString();
    os.ui.toast("Saved", "good");
  });

  document.getElementById("clear").addEventListener("click", async () => {
    await os.storage.clear();
    note.value = "";
    savedAt.textContent = "";
    os.ui.toast("Cleared");
  });

  // ---- live system data --------------------------------------------------
  async function tick() {
    const s = await os.system.status();
    document.getElementById("status").textContent =
      s.user + "@" + s.host + "  ·  load " + s.load.toFixed(2) +
      "  ·  mem " + s.mem.used_pct + "%  ·  up " + os.ui.duration(s.uptime);
  }
  tick();
  setInterval(tick, 5000);
})();
</script>
</body>
</html>
