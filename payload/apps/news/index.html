<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>News</title>
  <link rel="stylesheet" href="/lib/nethos.css">
  <script src="/lib/nethos.js"></script>
  <style>
    body { padding: 0; background: transparent; overflow: hidden; }
    .wrap { height: 100%; display: flex; flex-direction: column; padding: 15px 17px; }
    .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .head h3 { margin: 0; }
    .list { flex: 1; overflow-y: auto; margin: 0 -6px; }
    .item {
      display: block; width: 100%; text-align: left;
      padding: 8px 6px; border-radius: var(--r-sm);
      transition: background var(--fast); cursor: pointer;
      border: 0; background: none; font: inherit; color: inherit;
    }
    .item:hover { background: var(--glass-sunk); }
    .item .t {
      font-size: 12.5px; line-height: 1.4; font-weight: 500;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .item .s { font-size: 10.5px; color: var(--ink-faint); margin-top: 2px; }
    .empty { font-size: 12px; color: var(--ink-faint); padding: 10px 6px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h3>News</h3>
      <span class="spacer"></span>
      <button class="btn btn-quiet" id="refresh" title="Refresh" style="padding:3px 9px;font-size:11px">↻</button>
    </div>
    <div class="list" id="list"><div class="empty">Loading…</div></div>
  </div>

<script>
(async () => {
  const os = await nethos.ready();
  const list = document.getElementById("list");

  // Your feeds, stored per-app so they survive updates. Edit them from a
  // terminal if you like: ~/.local/state/nethos/apps/news.json
  const DEFAULT_FEEDS = [
    "https://feeds.bbci.co.uk/news/world/rss.xml",
    "https://hnrss.org/frontpage",
  ];

  function timeAgo(date) {
    const s = (Date.now() - date.getTime()) / 1000;
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
    if (s < 86400) return Math.round(s / 3600) + "h ago";
    return Math.round(s / 86400) + "d ago";
  }

  async function fetchFeed(url) {
    // Fetched directly by the widget. No server, no API key, no account —
    // the page just reads the feed, the way a feed is meant to be read.
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const xml = new DOMParser().parseFromString(await res.text(), "text/xml");
    const source = xml.querySelector("channel > title, feed > title");
    const nodes = [...xml.querySelectorAll("item, entry")].slice(0, 12);
    return nodes.map((n) => {
      const link = n.querySelector("link");
      const dateText = (n.querySelector("pubDate, updated, published") || {}).textContent;
      return {
        title: (n.querySelector("title") || {}).textContent || "",
        link: link ? (link.getAttribute("href") || link.textContent) : "",
        source: source ? source.textContent : new URL(url).hostname,
        date: dateText ? new Date(dateText) : null,
      };
    });
  }

  async function load() {
    const feeds = await os.storage.get("feeds", DEFAULT_FEEDS);
    const results = await Promise.allSettled(feeds.map(fetchFeed));
    const items = results.filter((r) => r.status === "fulfilled")
                         .flatMap((r) => r.value);

    if (!items.length) {
      list.replaceChildren(Object.assign(document.createElement("div"), {
        className: "empty",
        textContent: "No headlines. Check your connection, or set your feeds in ~/.local/state/nethos/apps/news.json",
      }));
      return;
    }

    items.sort((a, b) => (b.date || 0) - (a.date || 0));
    list.replaceChildren(...items.slice(0, 20).map((it) => {
      const b = document.createElement("button");
      b.className = "item";
      const t = os.ui.el("div", "t", it.title);
      const s = os.ui.el("div", "s",
        it.source + (it.date ? " · " + timeAgo(it.date) : ""));
      b.append(t, s);
      // Open in the browser as a real window rather than inside the widget.
      b.addEventListener("click", () => {
        if (it.link) os.apps.launch("chromium.desktop").then(() => {
          os.system.notify("Opening " + it.source);
        });
      });
      return b;
    }));
  }

  document.getElementById("refresh").addEventListener("click", load);
  load();
  setInterval(load, 15 * 60 * 1000);
})();
</script>
</body>
</html>
