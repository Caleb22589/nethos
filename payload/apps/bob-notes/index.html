<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bob Notes — NETHOS</title>
  <link rel="stylesheet" href="/lib/nethos.css">
  <script src="/lib/nethos.js"></script>
  <script src="/lib/nethos-ui.js"></script>
</head>
<body>
  <div class="neth-app-header">
    <h1>Bob Notes</h1>
    <span class="neth-sub">generated by tools/bob — edit the .py, not the .html</span>
  </div>
  <div class="neth-card">
    <div class="neth-card-title">Persistent storage</div>
    <p class="neth-dim">Saved to ~/.local/state/nethos/apps/bob-notes.json, so it survives reboots, reinstalls and profile wipes.</p>
    <label class="neth-label" for="note">Your note</label>
    <textarea class="neth-textarea" id="note" placeholder="Type something…"></textarea>
    <div class="neth-row">
      <button class="neth-btn neth-btn-primary" id="save">Save</button>
      <button class="neth-btn" id="clear">Clear</button>
      <span class="neth-spacer"></span>
      <span class="neth-dim neth-mono" id="saved-at"></span>
    </div>
  </div>
  <div class="neth-card">
    <div class="neth-card-title">System</div>
    <span class="neth-dim neth-mono" id="status">...</span>
  </div>

<script>
(async () => {
  const os = await nethos.ready();
  {
    document.getElementById("note").value = await os.storage.get("note", "");
  }
  document.getElementById("save").addEventListener("click", async () => {
    await os.storage.set("note", document.getElementById("note").value);
    await os.storage.set("savedAt", Date.now());
    document.getElementById("saved-at").textContent = `saved ${new Date().toLocaleString()}`;
    os.ui.toast("Saved", "good");
  });
  document.getElementById("clear").addEventListener("click", async () => {
    await os.storage.set("note", "");
    document.getElementById("note").value = "";
    document.getElementById("saved-at").textContent = "";
    os.ui.toast("Cleared", undefined);
  });
  async function _tick_5000() {
    const s = await os.system.status();
    document.getElementById("status").textContent = `${(s).user}@${(s).host} · load ${(s).load} · mem ${((s).mem).used_pct}% · up ${(s).uptime}s`;
  }
  _tick_5000();
  setInterval(_tick_5000, 5000);
})();
</script>
</body>
</html>
