<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NETHOS Menu</title>
  <link rel="stylesheet" href="style.css">
  <script src="shell.js" defer></script>
</head>
<body data-view="menu">
  <div id="menu">
    <div class="menu-head">
      <h1>NETHOS</h1>
      <span class="sub">application launcher</span>
    </div>

    <input id="search" type="text" placeholder="Search applications…" autocomplete="off" spellcheck="false">
    <div id="count"></div>
    <div id="grid"></div>

    <div class="menu-foot">
      <button class="pw" data-builtin="terminal">TERMINAL</button>
      <button class="pw" data-builtin="lock">LOCK</button>
      <span class="spacer"></span>
      <span class="hint">↑↓←→ navigate · enter launch · esc close</span>
      <span class="spacer"></span>
      <button class="pw" data-builtin="logout">LOG OUT</button>
      <button class="pw" data-builtin="reboot">REBOOT</button>
      <button class="pw danger" data-builtin="poweroff">SHUT DOWN</button>
    </div>
  </div>
</body>
</html>
