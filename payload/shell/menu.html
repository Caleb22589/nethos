<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Applications</title>
  <link rel="stylesheet" href="style.css">
  <script src="/lib/nethos-ui.js" defer></script>
  <script src="shell.js" defer></script>
</head>
<body data-view="menu">
  <div id="menu">
    <input id="search" class="input" type="text" placeholder="Search"
           autocomplete="off" spellcheck="false">
    <div id="count"></div>
    <div id="grid"></div>
    <div class="menu-foot">
      <span class="hint">↑↓ move · ↵ open · esc close</span>
      <span class="spacer"></span>
      <button class="pw" data-builtin="lock">Lock</button>
      <button class="pw" data-builtin="logout">Log out</button>
      <button class="pw" data-builtin="reboot">Restart</button>
      <button class="pw danger" data-builtin="poweroff">Shut down</button>
    </div>
  </div>
  <div id="switcher">
    <div id="switcher-sky"></div>
    <div id="switcher-world"></div>
  </div>
</body>
</html>
