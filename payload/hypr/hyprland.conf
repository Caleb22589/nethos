# NETHOS — Hyprland configuration.
#
# Hyprland rather than sway for one reason: sway cannot round a corner or blur
# anything. The NETHOS shell draws translucent glass surfaces, and glass only
# reads as glass if what is behind it is actually blurred — which only the
# compositor can do. Rounded corners come from the same place.
#
# nethosd speaks both compositors, so a sway session still works; this is the
# one that looks the way NETHOS is meant to look.

monitor = , preferred, auto, 1

exec-once = nethos-session

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    # Borders are nearly invisible on purpose: the shadow and the rounding do
    # the separating, the way they do on macOS.
    col.active_border   = rgba(ffffff40)
    col.inactive_border = rgba(ffffff14)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 14

    # The blur behind everything. `xray` lets layer surfaces sample the
    # wallpaper rather than the windows stacked under them, which is what stops
    # the panel and dock going muddy when a window slides beneath.
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = true
        ignore_opacity = true
        noise = 0.015
        contrast = 1.05
        brightness = 1.05
    }

    shadow {
        enabled = true
        range = 28
        render_power = 3
        color = rgba(11161f33)
        offset = 0 6
    }

    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false
}

animations {
    enabled = true
    # A single easing curve everywhere, mirroring the one in nethos.css, so
    # windows and interface animate as one system.
    bezier = settle, 0.32, 0.72, 0, 1
    bezier = quick,  0.22, 1.00, 0.36, 1

    animation = windows,     1, 4, settle, popin 92%
    animation = windowsOut,  1, 3, settle, popin 92%
    animation = fade,        1, 3, quick
    animation = border,      1, 6, settle
    animation = workspaces,  1, 4, settle, slidefade 15%
    animation = layers,      1, 3, settle, fade
}

input {
    kb_options = terminate:ctrl_alt_bksp
    follow_mouse = 1
    touchpad {
        natural_scroll = true          # the macOS default
        disable_while_typing = true
        tap-to-click = true
    }
    sensitivity = 0
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    # The NETHOS desktop surface draws the wallpaper, so Hyprland should not.
    background_color = 0xf0eef2f8
    vfr = true                          # do not redraw a static screen
    vrr = 1
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_gaps = true
}

# --- the shell -------------------------------------------------------------
# Blur the NETHOS layer surfaces by namespace, and let the desktop surface sit
# flat as the wallpaper it is.
layerrule = blur, nethos-panel
layerrule = blur, nethos-dock
layerrule = blur, nethos-menu
layerrule = ignorealpha 0.1, nethos-panel
layerrule = ignorealpha 0.1, nethos-dock
layerrule = ignorealpha 0.1, nethos-menu
layerrule = noanim, nethos-desktop
layerrule = blurpopups, nethos-menu

# NETHOS app windows: rounded and floating-friendly; nethosd places widgets.
windowrulev2 = rounding 14, class:^(chrome-127\.0\.0\.1.*)$
windowrulev2 = float, class:^(chrome-127\.0\.0\.1__apps_.*)$
windowrulev2 = noborder, class:^(nethos-widget)$

# Dialogs behave like dialogs.
windowrulev2 = float, title:^(Open|Save|Choose).*
windowrulev2 = center, floating:1

# --- keys ------------------------------------------------------------------
$mod = SUPER

bind = $mod, Return, exec, foot
bind = $mod, Space, exec, nethos-menu-toggle
bind = $mod, D, exec, nethos-menu-toggle
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, Space, togglefloating
bind = $mod, V, togglesplit
bind = $mod SHIFT, R, exec, nethos-reload
bind = $mod CTRL SHIFT, R, exec, nethos-reload --daemon

# Visual Alt+Tab switcher -- see the matching block in sway/config for how
# this is meant to behave; nethosd (not the compositor) decides whether a
# press opens or steps it.
bind = ALT, Tab, exec, nethos-switcher next
bind = ALT SHIFT, Tab, exec, nethos-switcher prev
bindr = ALT, Alt_L, exec, nethos-switcher activate

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media and brightness keys, because this is meant to be a laptop OS.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland
